name: Publicar DashDaily Mobile

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag ou commit do repositório principal
        required: true
        default: main
        type: string
      version:
        description: Versão semântica definida no app.json
        required: true
        type: string
      mandatory:
        description: Impedir que versões antigas adiem a atualização
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-mobile
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout release registry
        uses: actions/checkout@v4
        with:
          path: registry

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: DevKaue/Dash_Product
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: source/frontend
        run: npm ci

      - name: Validate release metadata
        working-directory: source/frontend/apps/mobile
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          APP_VERSION="$(jq -r '.expo.version' app.json)"
          test "$APP_VERSION" = "$REQUESTED_VERSION"
          test -f "release-notes/$REQUESTED_VERSION.json"
          echo "version_code=$(jq -r '.expo.android.versionCode' app.json)" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: source/frontend/apps/mobile
        env:
          CI: "1"
          EXPO_PUBLIC_API_URL: https://dashdaily-api.onrender.com/api
          EXPO_PUBLIC_RELEASE_CATALOG_URL: https://raw.githubusercontent.com/DevKaue/DashDaily-Releases/main/releases/latest.json
        run: npx expo prebuild --platform android --no-install

      - name: Restore Android signing key
        working-directory: source/frontend/apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dashdaily-release.keystore

      - name: Build signed APK
        working-directory: source/frontend/apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://dashdaily-api.onrender.com/api
          EXPO_PUBLIC_RELEASE_CATALOG_URL: https://raw.githubusercontent.com/DevKaue/DashDaily-Releases/main/releases/latest.json
          DASHDAILY_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/source/frontend/apps/mobile/android/app/dashdaily-release.keystore
          DASHDAILY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DASHDAILY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DASHDAILY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release files
        env:
          VERSION: ${{ inputs.version }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          APK="source/frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          TARGET="registry/dashdaily-mobile-$VERSION-android.apk"
          cp "$APK" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | cut -d ' ' -f 1)"
          SIZE="$(stat -c '%s' "$TARGET")"
          node registry/scripts/prepare-release.mjs \
            --version "$VERSION" \
            --version-code "$version_code" \
            --notes "source/frontend/apps/mobile/release-notes/$VERSION.json" \
            --sha256 "$SHA256" \
            --size "$SIZE" \
            --mandatory "$MANDATORY" \
            --output registry/releases

      - name: Publish immutable GitHub release
        working-directory: registry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dashdaily-mobile-$VERSION-android.apk" \
            --target main \
            --title "DashDaily Mobile $VERSION" \
            --notes-file "releases/$VERSION.md"

      - name: Publish update catalog
        working-directory: registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm "dashdaily-mobile-$VERSION-android.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git commit -m "release: publica DashDaily Mobile $VERSION"
          git push
