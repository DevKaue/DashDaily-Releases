name: Publicar guia em PDF

on:
  push:
    branches:
      - main
    paths:
      - "releases/latest.json"
      - "releases/*.md"
      - "scripts/generate-guide.py"
      - ".github/workflows/publish-guide.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-guide
  cancel-in-progress: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.4 pypdf==6.0.0

      - name: Generate current guide
        id: guide
        run: |
          VERSION="$(jq -r '.version' releases/latest.json)"
          OUTPUT="dist/Guia_de_Utilizacao_DashDaily_${VERSION}.pdf"
          python scripts/generate-guide.py --catalog releases/latest.json --output "$OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Validate PDF
        env:
          PDF_PATH: ${{ steps.guide.outputs.output }}
          EXPECTED_VERSION: ${{ steps.guide.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pypdf import PdfReader

          path = os.environ["PDF_PATH"]
          version = os.environ["EXPECTED_VERSION"]
          reader = PdfReader(path)
          assert len(reader.pages) == 13, f"Quantidade inesperada de páginas: {len(reader.pages)}"
          assert reader.metadata.title == f"Guia de Utilização DashDaily {version}"
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          assert f"versão {version}" in text.lower()
          assert "Atualizações integradas ao aplicativo" in text
          assert "DevKaue/DashDaily-Releases" in text
          print(f"PDF {version} validado: {len(reader.pages)} páginas")
          PY

      - name: Attach guide to current release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.guide.outputs.version }}
          PDF_PATH: ${{ steps.guide.outputs.output }}
        run: gh release upload "v$VERSION" "$PDF_PATH" --clobber
